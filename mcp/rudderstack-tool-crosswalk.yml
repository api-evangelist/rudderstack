source: >-
  mcp/rudderstack-mcp.yml (tool categories captured from
  https://mcp.rudderstack.com/docs and the provider-published
  skills/rudderstack-rudder-mcp-workflow.md),
  openapi/rudderstack-http-api-api-openapi.yml,
  openapi/rudderstack-internal-api-api-openapi.yml, and the documented
  control-plane operations at https://www.rudderstack.com/docs/api/.
description: >-
  Binds RudderStack's hosted MCP tool surface to its REST surface. THE HEADLINE
  FINDING IS A PLANE MISMATCH: the only OpenAPI documents in this repo describe
  the DATA plane (the write-key-authenticated event ingest endpoints on the
  customer's data plane URL), while every MCP tool operates on the CONTROL plane
  at https://api.rudderstack.com — sources, destinations, transformations,
  schemas, live events. RudderStack publishes no OpenAPI for the control plane,
  so not one MCP tool binds to an operationId in openapi/. The crosswalk records
  that gap explicitly rather than manufacturing bindings.
  Confidence is low throughout because tools/list is OAuth-gated (HTTP 401):
  RudderStack publishes tool CATEGORIES in prose, not tool names or inputSchemas,
  and its own agent skill states the client's discovered list is authoritative.
surfaces:
  openapi:
    - path: openapi/rudderstack-http-api-api-openapi.yml
      plane: data
      base: '{DATA_PLANE_URL}'
      auth: HTTP Basic, source write key as username
      operations: [Identify, Track, Page, Screen, Group, Alias, Batch]
      gated: false
    - path: openapi/rudderstack-internal-api-api-openapi.yml
      plane: data
      base: '{DATA_PLANE_URL}'
      operations: [Extract, Retl, AudienceList, Replay, InternalBatch]
      gated: false
      note: Internal data-plane routes used by Reverse ETL, Audiences and Replay.
  rest_documented_but_unspecified:
    base: https://api.rudderstack.com
    regional_base: https://api.eu.rudderstack.com
    plane: control
    auth: Bearer Service Access Token or Personal Access Token
    docs: https://www.rudderstack.com/docs/api/
    openapi: null
    note: >-
      RudderStack documents these endpoints in prose + curl on the docs site but
      publishes no machine-readable contract for them. Operation names used below
      are DESCRIPTIVE labels derived from the documented method+path, not
      operationIds that exist in any spec.
  graphql:
    endpoint: null
    file: graphql/rudderstack-schema.graphql
    note: >-
      NOT A RUDDERSTACK SURFACE. That file is a conceptual schema written from the
      docs in an earlier pass and says so in its own header; RudderStack ships no
      GraphQL endpoint. It is excluded from every binding below.
  mcp:
    url: https://mcp.rudderstack.com/mcp
    gated: true
    http_status: 401
    auth: oauth
