plans:
  - id: rudderstack-free
    name: Free
    type: free
    price: 0
    currency: USD
    period: month
    trial: null
    audience: Startups and small teams building their customer data stack.
    included:
      events_per_month: 250000
      sdk_sources: 16
      cloud_event_sources: 15
      cloud_destinations: 200
      warehouse_destinations: 10
      warehouse_sync_interval: 3 hours
      reverse_etl_connections: 10
      transformations_limit: 5
      tracking_plans: 1
      tracking_plan_events: 5
      team_members: 10
      workspaces: Prod only
    excluded:
      - Python Transformations
      - Event Audit API
      - Event Replay
      - Bot Management
      - Advanced Consent Integration
      - PII Masking
      - User Suppression & Deletion API
      - SSO
      - SSH Tunnel
      - Profiles & Data Apps
    support: Community Slack
  - id: rudderstack-growth
    name: Growth
    type: paid
    price: 265
    currency: USD
    period: month
    price_basis: 1 million events/month (entry rung)
    annual_discount: 15%
    trial: 30 days
    audience: Teams with higher volume and advanced integration needs.
    volume_ladder:
      - 1 million events/month
      - 3 million events/month
      - 5 million events/month
      - 7 million events/month
      - 10 million events/month
      - 25 million events/month
      - '> 25 million — contact sales'
    included:
      warehouse_sync_interval: 30 minutes
      reverse_etl_connections: 25
      transformations_limit: 25
      tracking_plans: unlimited
      tracking_plan_events: 75
      team_members: unlimited
      workspaces: 2 (Dev + Prod)
      access_management_groups: 3
      alerting_channels: Email, Webhook, Slack, MS Teams, PagerDuty, incident.io
    adds_over_free:
      - Python Transformations
      - Event Audit API
      - Event Replay
      - Bot Management
      - Advanced Consent Integration
      - PII Masking
      - User Suppression & Deletion API
      - SSH Tunnel
      - Dedicated Slack support
    support: Dedicated Slack, email
  - id: rudderstack-enterprise
    name: Enterprise
    type: custom
    price: null
    currency: USD
    period: null
    audience: Large organizations requiring advanced security, governance and white-glove support.
    included:
      events_per_month: Enterprise-grade volume, quoted
      warehouse_sync_interval: 5 minutes
      reverse_etl_connections: unlimited
      transformations_limit: unlimited
      tracking_plan_events: unlimited
      workspaces: custom
      data_retention: custom
      access_management_groups: unlimited
    adds_over_growth:
      - Profiles & Data Apps — identity resolution, Feature Builder, Customer 360 table, Audience Builder, Activations, Attribution, Propensity Scores, real-time Activation API, Activation API Redis cache
      - SSO
      - VPC deployment
      - HIPAA / BAA
      - Custom MSA
      - Custom alerting channels
      - Technical Account Manager, Customer Success Manager, Solutions Architect, onboarding support up to 6 months
    support: White glove — TAM, CSM, Solutions Architect
self_hosted:
  id: rudderstack-open-source
  name: Open Source (self-hosted rudder-server)
  price: 0
  note: >-
    Not a pricing-page tier. The rudder-server data plane is open source and
    self-hostable; the operator pays their own infrastructure cost and RudderStack
    charges no software fee. Personal Access Tokens are documented as the
    control-plane token type for Free and self-hosted plans.
  repo: https://github.com/rudderlabs/rudder-server
metering:
  primary_metric: events tracked per month through Event Stream
  secondary_gates:
    - Reverse ETL connections
    - Transformation count
    - Tracking plan events
    - Warehouse sync interval
    - Workspace count
