plan_count: 3
description: >-
  RudderStack publishes THREE tiers on its pricing page as of 2026-08-13 — Free,
  Growth and Enterprise — metered on monthly events tracked through the Event
  Stream pipeline. Growth is priced from $265/month for 1 million events with a
  published volume ladder (1M, 3M, 5M, 7M, 10M, 25M, then "talk to sales"), 15%
  off on annual billing, and a 30-day free trial. Enterprise is quote-only.
  A fourth surface exists outside the price list: the rudder-server data plane is
  open source and self-hostable at no software cost.
  CHANGE SINCE THE LAST PASS (2026-05-08): the "Starter" tier at $220/month is
  gone. The published ladder is now Free → Growth ($265) → Enterprise, and the
  Free tier's Reverse ETL connection allowance is 10 (previously recorded
  differently). This artifact was upgraded from method:generated to
  method:searched by reading the live pricing page.
notes: >-
  Growth's headline price is per-month at the 1M-events rung; higher rungs are
  selectable on the page but their prices are rendered client-side and were not
  captured as numbers, so only the entry price is recorded here rather than a
  guessed ladder. Enterprise and >25M events are sales-quoted.
sources:
